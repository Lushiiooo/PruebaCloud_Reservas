version: '3.9'

services:
  web:
    build: ./sistema_reservas_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./sistema_reservas_backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./sistema_reservas_backend/.env
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/1

  celery:
    build: ./sistema_reservas_backend
    command: celery -A config worker --loglevel=info
    volumes:
      - ./sistema_reservas_backend:/app
    env_file:
      - ./sistema_reservas_backend/.env
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/1

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  redis_data:
